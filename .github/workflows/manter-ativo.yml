name: Manter agendamentos ativos

# O GitHub desliga os agendamentos de repositórios públicos após 60 dias sem commits.
# Reativar os workflows pela API zera essa contagem.
on:
  schedule:
    - cron: "0 9 1,15 * *"   # dias 1 e 15 de cada mês
  workflow_dispatch:

permissions:
  actions: write

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          for wf in coletar-gerar.yml telegram.yml publicar.yml manter-ativo.yml; do
            gh workflow enable "$wf" --repo "${{ github.repository }}"
          done
