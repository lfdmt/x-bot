# Usado pela Vercel (webhook do Telegram e relógio). O GitHub Actions usa o requirements.txt.
[project]
name = "x-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "supabase>=2.10",
    "feedparser>=6.0",
    "tweepy>=4.14",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "requests-oauthlib>=1.3",
    "pillow>=10.0",
]

[tool.vercel]
entrypoint = "api.index:handler"
